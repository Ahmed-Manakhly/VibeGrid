services:
  vibegrid_ui_dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vibegrid_ui_dev
    restart: unless-stopped
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-vibegrid}:${POSTGRES_PASSWORD:-vibegrid_secret}@vibegrid_postgres:5432/${POSTGRES_DB:-vibegrid_db}?schema=public
      - AUTH_SERVICE_URL=http://vibegrid_api_gateway:8000/api/auth
      - NEXT_PUBLIC_API_GATEWAY_URL=http://localhost:8000
      - INTERNAL_API_GATEWAY_URL=http://vibegrid_api_gateway:8000
      - LOG_DIR=/logs
    ports:
      - "3000:3000"
    networks:
      - vibegrid_net
    volumes:
      - vibegrid_ui_dev_logs:/logs

networks:
  vibegrid_net:
    name: vibegrid_net
    external: true

volumes:
  vibegrid_ui_dev_logs:
