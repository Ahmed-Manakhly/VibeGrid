services:
  vibegrid_bff:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vibegrid_bff
    restart: always
    env_file:
      - .env
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL_DOCKER_DEV:-postgresql://vibegrid:VgDB_P2026%23k9%24XmL!8qWz@vibegrid_postgres:5432/vibegrid_db?schema=public}
      - REDIS_URL=${REDIS_URL_DOCKER_DEV:-redis://:VgRedis_R2026%23m4%24ZpQ%219wKx@vibegrid_redis:6379}
      - LOG_DIR=/logs
    ports:
      - "3000:3000"
    networks:
      vibegrid_net:
        aliases:
          - vibegrid_bff
          - vibegrid_ui
    volumes:
      - vibegrid_bff_logs:/logs

networks:
  vibegrid_net:
    name: vibegrid_net
    external: true

volumes:
  vibegrid_bff_logs:
