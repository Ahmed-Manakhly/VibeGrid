services:
  vibegrid_bff:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vibegrid_bff
    restart: always
    env_file:
      - .env
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL:-redis://vibegrid_redis:6379}
      - AUTH_SERVICE_URL=http://vibegrid_api_gateway:8000/api/auth
      - LOG_DIR=/logs
    ports:
      - "3000:3000"
    networks:
      vibegrid_net:
        aliases:
          - vibegrid_bff
          - vibegrid_ui
    volumes:
      - vibegrid_bff_logs:/logs

networks:
  vibegrid_net:
    name: vibegrid_net
    external: true

volumes:
  vibegrid_bff_logs:
