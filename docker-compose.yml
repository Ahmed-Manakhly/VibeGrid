services:
  vibegrid_bff:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vibegrid_bff
    restart: always
    env_file:
      - .env
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@vibegrid_postgres:5432/${POSTGRES_DB}?schema=public
      - REDIS_URL=redis://:${REDIS_PASSWORD}@vibegrid_redis:6379
      - LOG_DIR=/logs
    expose:
      - "3000"
    networks:
      vibegrid_net:
        aliases:
          - vibegrid_bff
          - vibegrid_ui
    volumes:
      - vibegrid_bff_logs:/logs

networks:
  vibegrid_net:
    name: vibegrid_net
    external: true

volumes:
  vibegrid_bff_logs:
